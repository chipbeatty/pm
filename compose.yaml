services:
  app:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/hello', timeout=2).read()"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
